<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="112" fill="#090D16" />
  <defs>
    <linearGradient id="pwaPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#A78BFA" />
      <stop offset="60%" stopColor="#7C3AED" />
      <stop offset="100%" stopColor="#4C1D95" />
    </linearGradient>
    <linearGradient id="pwaEmerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#059669" />
      <stop offset="50%" stopColor="#10B981" />
      <stop offset="100%" stopColor="#34D399" />
    </linearGradient>
    <linearGradient id="pwaOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FB923C" />
      <stop offset="50%" stopColor="#F97316" />
      <stop offset="100%" stopColor="#EA580C" />
    </linearGradient>
    <linearGradient id="pwaSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FDE047" />
      <stop offset="100%" stopColor="#F97316" />
    </linearGradient>
    <filter id="pwaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" floodColor="#7C3AED" floodOpacity="0.45" />
    </filter>
  </defs>
  
  <g transform="translate(46, 46) scale(3.5)" filter="url(#pwaGlow)">
    <!-- Botanical Leaf -->
    <path d="M 60,16 C 36,16 16,36 16,62 C 16,84 36,100 58,104 C 44,92 36,76 38,58 C 40,40 48,26 60,16 Z" fill="url(#pwaEmerald)" />
    <!-- Health Arc -->
    <path d="M 60,16 C 72,26 80,40 82,58 C 84,76 76,92 62,104 C 84,100 104,84 104,62 C 104,36 84,16 60,16 Z" fill="url(#pwaPurple)" />
    <!-- Core Vital Flame -->
    <path d="M 60,40 C 50,50 46,62 48,74 C 50,86 58,94 60,98 C 62,94 70,86 72,74 C 74,62 70,50 60,40 Z" fill="url(#pwaOrange)" />
    <!-- Highlights -->
    <path d="M 28,42 C 22,54 22,68 28,80" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round" />
    <circle cx="60" cy="28" r="5" fill="url(#pwaSpark)" />
  </g>
</svg>
